<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Mark up</title><style>:root{--paper:#f6f1e7;--paper2:#ece5d6;--page:#fbf8f1;--ink:#1a1a1a;--ink2:#555048;--ink3:#8a8377;--rule:rgba(26,26,26,.16);--red:#c13d1c;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#e4dccb;display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:auto}
.phone{width:390px;height:844px;flex:none;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sb{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font:600 13px var(--sans)}
.sb i{width:22px;height:11px;border:1px solid currentColor;border-radius:3px;position:relative;opacity:.8}
.sb i:before{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.where{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 20px 9px;font:500 11px/1.3 var(--mono);color:var(--ink2);border-bottom:1px solid var(--ink)}
.where b{font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.where span{text-align:right}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
h1{font:400 27px/1.14 var(--serif);letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.dock{flex:none;padding:0 16px;border-top:1px solid var(--rule);background:var(--paper)}
.rec{display:flex;gap:9px;align-items:baseline;padding:7px 4px 6px;font:12.5px/1.3 var(--sans);color:var(--ink2);min-height:32px}
.rec b{font:600 10.5px var(--mono);text-transform:uppercase;color:var(--ink);letter-spacing:.03em;flex:none}
.rec.flash span{animation:fl .9s ease-out}
@keyframes fl{0%{background:rgba(193,61,28,.22)}100%{background:transparent}}
.other{display:flex;align-items:center;height:46px;border:1px solid var(--ink);border-radius:22px;padding-left:16px;background:var(--page)}
.other input{flex:1;min-width:0;border:0;background:none;outline:0;font:15px var(--sans);color:var(--ink);height:44px}
.other input::placeholder{color:var(--ink2)}
.mic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.mic.on{color:var(--red)}
.home{flex:none;height:22px;position:relative}
.home:after{content:"";position:absolute;left:50%;bottom:7px;width:128px;height:4.5px;border-radius:3px;margin-left:-64px;background:var(--ink)}
.dark{--paper:#151412;--ink:#f3eee3;--ink2:#a79f91;--ink3:#7a7367;--rule:rgba(243,238,227,.2);--page:#201e1a}

.doc{flex:1;min-height:0;overflow-y:auto;padding:12px 20px 12px;background:var(--page);scrollbar-width:none}
.doc::-webkit-scrollbar{display:none}
.doc h1{font-size:24px;margin-bottom:8px}
.l{display:block;width:calc(100% + 16px);margin:0 -8px;padding:5px 8px;text-align:left;font:400 18px/1.34 var(--serif);min-height:44px;position:relative}
.l.sel{background:rgba(193,61,28,.1);box-shadow:inset 3px 0 0 var(--red)}
.hit{background:linear-gradient(transparent 62%,rgba(217,164,65,.55) 62%)}
.note{margin:0 -8px 8px 12px;padding:6px 10px 7px;border-left:1.5px solid var(--red);position:relative;font:13.5px/1.32 var(--sans)}
.note:before{content:"";position:absolute;left:-13px;top:-6px;width:12px;height:17px;border-left:1.5px solid var(--red);border-bottom:1.5px solid var(--red);border-bottom-left-radius:8px;display:none}
.note b{display:block;font:600 10.5px var(--mono);color:var(--red);text-transform:uppercase}
.note i{display:block;font-style:normal;color:var(--ink2);margin-top:2px}
.talk{flex:none;background:var(--paper);border-top:1px solid var(--ink);padding:9px 20px 8px;display:flex;flex-direction:column;gap:7px}
.lab{font:500 11px/1.3 var(--mono);color:var(--ink2);display:flex;justify-content:space-between;gap:10px}
.lab span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heard{font:400 18px/1.28 var(--serif);min-height:47px}
.heard .c{display:inline-block;width:2px;height:17px;background:var(--red);vertical-align:-3px;margin-left:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.row{display:flex;align-items:center;gap:12px}
.wv{flex:1;height:34px;display:flex;gap:2.5px;align-items:center}
.wv i{flex:1;background:var(--ink);height:calc(var(--h)*1px);border-radius:1px;animation:w 1s ease-in-out infinite alternate;animation-delay:calc(var(--d)*1ms)}
@keyframes w{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
.off i{animation:none;transform:scaleY(.1)}
.bigm{width:72px;height:72px;flex:none;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
.bigm.off{background:var(--ink)}
.ty{height:44px;min-width:44px;font:500 14px var(--sans);flex:none}
</style></head><body class=""><div class="phone" id="phone"><div class="sb"><span>9:41</span><i></i></div><header class="where"><b>Mark up</b><span>Launch plan · Draft 3 · 2 notes</span></header><main>
  <div class="doc" id="d">
    <h1>Launch plan</h1>
    <button class="l" data-t="line 1">We will open the spring store in the second week of March.</button>
    <button class="l" data-t="line 2">The new <span class="hit">gift box</span> ships at the same time.</button>
    <div class="note"><b>Your note · line 2 · "gift box"</b>This is not ready. Move it to April.<i>Agent: I will change the date in lines 2 and 5.</i></div>
    <button class="l sel" data-t="line 3">Our goal is to reach all of the past buyers through a series of emails over a period of six weeks.</button>
    <button class="l" data-t="line 4">Each email shows one seed and one tip.</button>
    <button class="l" data-t="line 5">Gift box ads start on March 20.</button>
    <div class="note"><b>Your note · line 5</b>Cut the budget for these by half.</div>
    <button class="l" data-t="line 6">Sam writes the emails. Ines checks each one.</button>
    <button class="l" data-t="line 7">We review the results on April 30.</button>
  </div>
  <div class="talk">
    <div class="lab"><span id="tg">ON LINE 3 · SPEAK YOUR NOTE</span><span id="st">LISTENING</span></div>
    <div class="heard"><span id="h">Too long. Say the number</span><span class="c"></span></div>
    <div class="row">
      <div class="wv" id="w"></div>
      <button class="ty" id="ty">Type</button>
      <button class="bigm" id="m" aria-label="Finish note"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2" width="6" height="10.5" rx="3"/><path d="M3.8 9.5a6.2 6.2 0 0 0 12.4 0M10 15.8V18"/></svg></button>
    </div>
  </div>
</main><div class="home"></div></div><script>const DOCK_SAY="Show me something else.";const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function rec(t){const b=$('#rec'),e=$('#rec span');if(!e)return;e.textContent=t;b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
function onDrag(el,h){el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);h.start&&h.start(ev);const m=e=>h.move&&h.move(e),u=e=>{el.removeEventListener('pointermove',m);el.removeEventListener('pointerup',u);el.removeEventListener('pointercancel',u);h.end&&h.end(e)};el.addEventListener('pointermove',m);el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)})}
(function(){const p=$('#phone');const fit=()=>{p.style.zoom=innerWidth<390?innerWidth/390:''};fit();addEventListener('resize',fit);const f=$('#other');if(!f)return;const i=$('input',f),m=$('.mic',f);f.addEventListener('submit',e=>{e.preventDefault();if(i.value.trim()){rec('Your own words: '+i.value.trim());i.value=''}});m.addEventListener('click',()=>{m.classList.add('on');const ph=i.placeholder;i.placeholder='Listening';setTimeout(()=>{m.classList.remove('on');i.placeholder=ph;i.value=DOCK_SAY},1200)})})();

const W=$('#w');for(let i=0;i<34;i++){const x=document.createElement('i');x.style.setProperty('--h',4+Math.abs(Math.sin(i*.8)+Math.sin(i*.3))*12);x.style.setProperty('--d',i*53%800);W.append(x)}
let on=true,cur=$('.l.sel');const more=' of emails first.'.split(' ');let k=0;
setInterval(()=>{if(on&&k<more.length){$('#h').textContent+=' '+more[k++]}},800);
$$('.l').forEach(l=>l.onclick=()=>{$$('.l').forEach(x=>x.classList.remove('sel'));l.classList.add('sel');cur=l;$('#tg').textContent='ON '+l.dataset.t.toUpperCase()+' · SPEAK YOUR NOTE';$('#h').textContent='';k=more.length;setOn(true)});
function setOn(v){on=v;W.classList.toggle('off',!v);$('#m').classList.toggle('off',!v);$('#st').textContent=v?'LISTENING':'TAP TO SPEAK'}
$('#m').onclick=()=>{if(on){const t=$('#h').textContent.trim();if(t){const n=document.createElement('div');n.className='note';n.innerHTML='<b>Your note · '+cur.dataset.t+'</b>'+t+'.';cur.after(n);n.scrollIntoView({block:'nearest'});$('#h').textContent=''}setOn(false)}else setOn(true)};
$('#ty').onclick=()=>{setOn(true);const h=$('#h');h.contentEditable=true;h.style.userSelect='text';h.focus()};
$('#d').scrollTop=0;
</script></body></html>
