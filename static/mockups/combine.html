<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Combine</title><style>:root{--paper:#f6f1e7;--paper2:#ece5d6;--page:#fbf8f1;--ink:#1a1a1a;--ink2:#555048;--ink3:#8a8377;--rule:rgba(26,26,26,.16);--red:#c13d1c;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#e4dccb;display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:auto}
.phone{width:390px;height:844px;flex:none;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sb{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font:600 13px var(--sans)}
.sb i{width:22px;height:11px;border:1px solid currentColor;border-radius:3px;position:relative;opacity:.8}
.sb i:before{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.where{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 20px 9px;font:500 11px/1.3 var(--mono);color:var(--ink2);border-bottom:1px solid var(--ink)}
.where b{font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.where span{text-align:right}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
h1{font:400 27px/1.14 var(--serif);letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.dock{flex:none;padding:0 16px;border-top:1px solid var(--rule);background:var(--paper)}
.rec{display:flex;gap:9px;align-items:baseline;padding:7px 4px 6px;font:12.5px/1.3 var(--sans);color:var(--ink2);min-height:32px}
.rec b{font:600 10.5px var(--mono);text-transform:uppercase;color:var(--ink);letter-spacing:.03em;flex:none}
.rec.flash span{animation:fl .9s ease-out}
@keyframes fl{0%{background:rgba(193,61,28,.22)}100%{background:transparent}}
.other{display:flex;align-items:center;height:46px;border:1px solid var(--ink);border-radius:22px;padding-left:16px;background:var(--page)}
.other input{flex:1;min-width:0;border:0;background:none;outline:0;font:15px var(--sans);color:var(--ink);height:44px}
.other input::placeholder{color:var(--ink2)}
.mic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.mic.on{color:var(--red)}
.home{flex:none;height:22px;position:relative}
.home:after{content:"";position:absolute;left:50%;bottom:7px;width:128px;height:4.5px;border-radius:3px;margin-left:-64px;background:var(--ink)}
.dark{--paper:#151412;--ink:#f3eee3;--ink2:#a79f91;--ink3:#7a7367;--rule:rgba(243,238,227,.2);--page:#201e1a}

.ask{padding:12px 20px 8px}
.gridw{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--ink);position:relative}
.heads{display:grid;grid-template-columns:72px repeat(5,1fr);padding-right:6px;height:26px;align-items:center;font:600 10.5px var(--mono);color:var(--ink2);text-align:center}
.lines{position:absolute;left:0;top:0;width:390px;pointer-events:none;z-index:0}
.rw{flex:1;display:grid;grid-template-columns:72px repeat(5,1fr);padding-right:6px;border-top:1px solid var(--rule);min-height:0}
.rw>span{font:400 15.5px/1.1 var(--serif);padding-left:14px;align-self:center}
.cell{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:100%;min-height:44px}
.cell svg{width:52px;height:36px;display:block;opacity:.34;transition:opacity .15s}
.cell.on svg{opacity:1}
.cell.best:after{content:"";position:absolute;right:4px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.cut{flex:none;border-top:1px solid var(--ink);padding:8px 20px 8px;background:var(--page)}
.cut h2{display:flex;justify-content:space-between;font:600 11px var(--mono);text-transform:uppercase;margin-bottom:5px}
.seq{display:flex;gap:2px;height:32px}
.seq i{flex:1;font:500 10.5px/32px var(--mono);font-style:normal;text-align:center;background:var(--ink);color:var(--paper);white-space:nowrap;overflow:hidden}
.seq i.m{background:var(--red)}
.why{font:13.5px/1.32 var(--sans);color:var(--ink);margin-top:6px;min-height:36px}
.play{height:44px;width:100%;border:1px solid var(--ink);border-radius:22px;font:600 14.5px var(--sans);margin-top:4px}
</style></head><body class=""><div class="phone" id="phone"><div class="sb"><span>9:41</span><i></i></div><header class="where"><b>Combine</b><span>Song: Porch Light · 5 takes</span></header><main>
  <div class="ask"><h1>Build one song from five takes</h1></div>
  <div class="gridw" id="g">
    <div class="heads"><span></span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
  </div>
  <div class="cut"><h2><span>Your cut · 3:24</span><span id="cnt"></span></h2><div class="seq" id="q"></div><p class="why" id="w"></p><button class="play" id="p">Play your cut</button></div>
</main><footer class="dock"><div class="rec" id="rec"><b>Record</b><span>I marked my best take in each row.</span></div><form class="other" id="other"><input aria-label="Answer another way" placeholder="Tell me what to change in your cut"><button type="button" class="mic" aria-label="Speak your answer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2" width="6" height="10.5" rx="3"/><path d="M3.8 9.5a6.2 6.2 0 0 0 12.4 0M10 15.8V18"/></svg></button></form></footer><div class="home"></div></div><script>const DOCK_SAY="Use the slow intro. Then go straight to the chorus.";const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function rec(t){const b=$('#rec'),e=$('#rec span');if(!e)return;e.textContent=t;b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
function onDrag(el,h){el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);h.start&&h.start(ev);const m=e=>h.move&&h.move(e),u=e=>{el.removeEventListener('pointermove',m);el.removeEventListener('pointerup',u);el.removeEventListener('pointercancel',u);h.end&&h.end(e)};el.addEventListener('pointermove',m);el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)})}
(function(){const p=$('#phone');const fit=()=>{p.style.zoom=innerWidth<390?innerWidth/390:''};fit();addEventListener('resize',fit);const f=$('#other');if(!f)return;const i=$('input',f),m=$('.mic',f);f.addEventListener('submit',e=>{e.preventDefault();if(i.value.trim()){rec('Your own words: '+i.value.trim());i.value=''}});m.addEventListener('click',()=>{m.classList.add('on');const ph=i.placeholder;i.placeholder='Listening';setTimeout(()=>{m.classList.remove('on');i.placeholder=ph;i.value=DOCK_SAY},1200)})})();

const rows=[['Intro',3,.6],['Verse',2,1.2],['Chorus',5,1],['Verse 2',2,1.2],['Bridge',4,.8],['Last chorus',5,1.4]];
const why={Intro:'Take 3 starts with the guitar alone.',Verse:'Take 2 has the clearest words.',Chorus:'Take 5 has the strongest voice.','Verse 2':'Take 2 again. The tone matches verse 1.',Bridge:'Take 4 is quiet. It sets up the end.','Last chorus':'Take 5 lifts the end.'};
const G=$('#g'),sel=rows.map(r=>r[1]);
function wave(s){let r=s,h='';for(let i=0;i<20;i++){r=(r*7+13)%31;const y=3+(r/31)*15;h+=`<rect x="${i*2.6}" y="${18-y}" width="1.5" height="${2*y}" fill="currentColor"/>`}return `<svg viewBox="0 0 52 36">${h}</svg>`}
rows.forEach(([n,b],i)=>{const r=document.createElement('div');r.className='rw';r.innerHTML=`<span>${n}</span>`;for(let t=1;t<=5;t++){const c=document.createElement('button');c.className='cell'+(t==b?' best':'');c.dataset.r=i;c.dataset.t=t;c.innerHTML=wave(i*5+t);c.setAttribute('aria-label',n+' take '+t);c.onclick=()=>{sel[i]=t;draw();$('#w').textContent=t==b?why[n]:`You chose take ${t}. I chose take ${b}: ${why[n]}`;rec(`${n}: you took take ${t}.`)};r.append(c)}G.append(r)});
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','lines');G.append(svg);
function draw(){$$('.cell').forEach(c=>c.classList.toggle('on',sel[c.dataset.r]==c.dataset.t));
 const g=G.getBoundingClientRect(),pts=sel.map((t,i)=>{const c=$(`.cell[data-r="${i}"][data-t="${t}"]`).getBoundingClientRect();return[c.left+c.width/2-g.left,c.top+c.height/2-g.top]});
 svg.setAttribute('width',390);svg.setAttribute('height',g.height);svg.style.top=0;svg.innerHTML=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#c13d1c" stroke-width="2"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="24" fill="#f6f1e7" stroke="#c13d1c" stroke-width="1.5"/>`).join('');
 $('#q').innerHTML=rows.map(([n,b,f],i)=>`<i class="${sel[i]!=b?'m':''}" style="--f:${f}">${{'Last chorus':'End','Verse 2':'Verse2'}[n]||n}·${sel[i]}</i>`).join('');$('#cnt').textContent=new Set(sel).size+' TAKES USED'}
$('#w').textContent='A dot marks my pick. Tap any take to swap that part.';draw();
$('#p').onclick=()=>rec('You played your cut.');
</script></body></html>
