<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Steer</title><style>:root{--paper:#f6f1e7;--paper2:#ece5d6;--page:#fbf8f1;--ink:#1a1a1a;--ink2:#555048;--ink3:#8a8377;--rule:rgba(26,26,26,.16);--red:#c13d1c;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#e4dccb;display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:auto}
.phone{width:390px;height:844px;flex:none;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sb{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font:600 13px var(--sans)}
.sb i{width:22px;height:11px;border:1px solid currentColor;border-radius:3px;position:relative;opacity:.8}
.sb i:before{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.where{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 20px 9px;font:500 11px/1.3 var(--mono);color:var(--ink2);border-bottom:1px solid var(--ink)}
.where b{font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.where span{text-align:right}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
h1{font:400 27px/1.14 var(--serif);letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.dock{flex:none;padding:0 16px;border-top:1px solid var(--rule);background:var(--paper)}
.rec{display:flex;gap:9px;align-items:baseline;padding:7px 4px 6px;font:12.5px/1.3 var(--sans);color:var(--ink2);min-height:32px}
.rec b{font:600 10.5px var(--mono);text-transform:uppercase;color:var(--ink);letter-spacing:.03em;flex:none}
.rec.flash span{animation:fl .9s ease-out}
@keyframes fl{0%{background:rgba(193,61,28,.22)}100%{background:transparent}}
.other{display:flex;align-items:center;height:46px;border:1px solid var(--ink);border-radius:22px;padding-left:16px;background:var(--page)}
.other input{flex:1;min-width:0;border:0;background:none;outline:0;font:15px var(--sans);color:var(--ink);height:44px}
.other input::placeholder{color:var(--ink2)}
.mic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.mic.on{color:var(--red)}
.home{flex:none;height:22px;position:relative}
.home:after{content:"";position:absolute;left:50%;bottom:7px;width:128px;height:4.5px;border-radius:3px;margin-left:-64px;background:var(--ink)}
.dark{--paper:#151412;--ink:#f3eee3;--ink2:#a79f91;--ink3:#7a7367;--rule:rgba(243,238,227,.2);--page:#201e1a}

.now{height:172px;flex:none;padding:14px 20px 0}
.now small{font:500 11px var(--mono);color:var(--ink2);display:block;margin-bottom:6px}
.now p{font:400 29px/1.2 var(--serif);letter-spacing:-.012em}
.pad{flex:none;position:relative;width:330px;height:330px;margin:16px auto 0;background:var(--page);border:1px solid var(--ink)}
.pad svg{position:absolute;inset:0;pointer-events:none}
.cell{position:absolute;width:110px;height:110px}
.ax{position:absolute;font:600 10.5px var(--mono);text-transform:uppercase;color:var(--ink2)}
.ax.t{top:-15px;left:0;right:0;text-align:center}.ax.b{bottom:-16px;left:0;right:0;text-align:center}
.ax.l,.ax.r{top:50%;writing-mode:vertical-rl}
.ax.l{left:-17px;transform:translateY(-50%) rotate(180deg)}.ax.r{right:-17px;transform:translateY(-50%)}
.back{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font:13px var(--sans);color:var(--ink2);padding-top:12px}
.back button{height:44px;padding:0 14px;font:500 14px var(--sans);color:var(--ink);border:1px solid var(--ink);border-radius:22px}
</style></head><body class=""><div class="phone" id="phone"><div class="sb"><span>9:41</span><i></i></div><header class="where"><b>Steer</b><span>Order email · First line</span></header><main>
  <div class="now"><small id="tag"></small><p id="s"></p></div>
  <div class="pad" id="p">
    <div class="ax t">Formal</div><div class="ax b">Plain</div><div class="ax l">Cool</div><div class="ax r">Warm</div>
    <svg id="sv" width="330" height="330"></svg>
  </div>
  <div class="back"><button id="un">Go back one</button><button id="keep">Keep this line</button></div>
</main><footer class="dock"><div class="rec" id="rec"><b>Record</b><span>Three rounds so far. You can go back to any.</span></div><form class="other" id="other"><input aria-label="Answer another way" placeholder="Say how to change it"><button type="button" class="mic" aria-label="Speak your answer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2" width="6" height="10.5" rx="3"/><path d="M3.8 9.5a6.2 6.2 0 0 0 12.4 0M10 15.8V18"/></svg></button></form></footer><div class="home"></div></div><script>const DOCK_SAY="Warmer. And name the seeds.";const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function rec(t){const b=$('#rec'),e=$('#rec span');if(!e)return;e.textContent=t;b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
function onDrag(el,h){el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);h.start&&h.start(ev);const m=e=>h.move&&h.move(e),u=e=>{el.removeEventListener('pointermove',m);el.removeEventListener('pointerup',u);el.removeEventListener('pointercancel',u);h.end&&h.end(e)};el.addEventListener('pointermove',m);el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)})}
(function(){const p=$('#phone');const fit=()=>{p.style.zoom=innerWidth<390?innerWidth/390:''};fit();addEventListener('resize',fit);const f=$('#other');if(!f)return;const i=$('input',f),m=$('.mic',f);f.addEventListener('submit',e=>{e.preventDefault();if(i.value.trim()){rec('Your own words: '+i.value.trim());i.value=''}});m.addEventListener('click',()=>{m.classList.add('on');const ph=i.placeholder;i.placeholder='Listening';setTimeout(()=>{m.classList.remove('on');i.placeholder=ph;i.value=DOCK_SAY},1200)})})();

const T=[['We acknowledge receipt of your order.','Thank you for your order. We will ship it soon.','We are glad you chose us. Your seeds will reach you soon.'],['We have your order. It ships on Monday.','Thanks for your order. Your seeds ship on Monday.','Thank you. We packed your seeds with care.'],['Order received. Ships Monday.','Got it. Your seeds ship Monday.','Your seeds are on the way. We hope they grow well.']];
const P=$('#p');let trail=[[0,0],[1,1],[1,2]];
for(let y=0;y<3;y++)for(let x=0;x<3;x++){const b=document.createElement('button');b.className='cell';b.style.cssText=`left:${x*110}px;top:${y*110}px`;b.setAttribute('aria-label',T[y][x]);b.onclick=()=>{const i=trail.findIndex(t=>t[0]==y&&t[1]==x);if(i>=0)trail=trail.slice(0,i+1);else trail.push([y,x]);draw();rec(`Round ${trail.length}: you steered to a new line.`)};P.append(b)}
function draw(){let h='';for(let i=1;i<3;i++)h+=`<path d="M${i*110} 0V330M0 ${i*110}H330" stroke="#1a1a1a" stroke-opacity=".13"/>`;const c=t=>[t[1]*110+55,t[0]*110+55];h+=`<polyline points="${trail.map(t=>c(t).join(',')).join(' ')}" fill="none" stroke="#c13d1c" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>`;trail.forEach((t,i)=>{const [x,y]=c(t),l=i==trail.length-1;h+=`<circle cx="${x}" cy="${y}" r="${l?20:14}" fill="${l?'#c13d1c':'#fbf8f1'}" stroke="#${l?'c13d1c':'1a1a1a'}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-family="Georgia,serif" font-size="${l?17:14}" fill="${l?'#fff':'#1a1a1a'}">${i+1}</text>`});$('#sv').innerHTML=h;const [y,x]=trail[trail.length-1];$('#s').textContent=T[y][x];$('#tag').textContent='ROUND '+trail.length+' OF THE LINE'}
$('#un').onclick=()=>{if(trail.length>1){trail.pop();draw();rec('You went back one round.')}};$('#keep').onclick=()=>rec(`You kept the line from round ${trail.length}.`);draw();
</script></body></html>
