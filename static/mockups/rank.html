<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Rank</title><style>:root{--paper:#f6f1e7;--paper2:#ece5d6;--page:#fbf8f1;--ink:#1a1a1a;--ink2:#555048;--ink3:#8a8377;--rule:rgba(26,26,26,.16);--red:#c13d1c;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#e4dccb;display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:auto}
.phone{width:390px;height:844px;flex:none;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sb{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font:600 13px var(--sans)}
.sb i{width:22px;height:11px;border:1px solid currentColor;border-radius:3px;position:relative;opacity:.8}
.sb i:before{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.where{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 20px 9px;font:500 11px/1.3 var(--mono);color:var(--ink2);border-bottom:1px solid var(--ink)}
.where b{font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.where span{text-align:right}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
h1{font:400 27px/1.14 var(--serif);letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.dock{flex:none;padding:0 16px;border-top:1px solid var(--rule);background:var(--paper)}
.rec{display:flex;gap:9px;align-items:baseline;padding:7px 4px 6px;font:12.5px/1.3 var(--sans);color:var(--ink2);min-height:32px}
.rec b{font:600 10.5px var(--mono);text-transform:uppercase;color:var(--ink);letter-spacing:.03em;flex:none}
.rec.flash span{animation:fl .9s ease-out}
@keyframes fl{0%{background:rgba(193,61,28,.22)}100%{background:transparent}}
.other{display:flex;align-items:center;height:46px;border:1px solid var(--ink);border-radius:22px;padding-left:16px;background:var(--page)}
.other input{flex:1;min-width:0;border:0;background:none;outline:0;font:15px var(--sans);color:var(--ink);height:44px}
.other input::placeholder{color:var(--ink2)}
.mic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.mic.on{color:var(--red)}
.home{flex:none;height:22px;position:relative}
.home:after{content:"";position:absolute;left:50%;bottom:7px;width:128px;height:4.5px;border-radius:3px;margin-left:-64px;background:var(--ink)}
.dark{--paper:#151412;--ink:#f3eee3;--ink2:#a79f91;--ink3:#7a7367;--rule:rgba(243,238,227,.2);--page:#201e1a}

.ask{padding:12px 20px 8px}
.ask p{font:14px/1.3 var(--sans);color:var(--ink2);margin-top:3px}
.list{flex:1;position:relative;touch-action:none;overflow:hidden;border-top:1px solid var(--ink)}
.row{position:absolute;left:0;right:0;display:flex;gap:10px;padding:0 14px 0 20px;align-items:center;transition:top .2s,opacity .2s,box-shadow .15s;background:var(--paper);touch-action:none;cursor:grab;border-bottom:1px solid var(--rule)}
.row.drag{transition:none;z-index:5;box-shadow:0 8px 22px rgba(40,30,10,.22);background:var(--page)}
.row .num{font:400 var(--fn)/1 var(--serif);width:40px;flex:none;color:var(--ink)}
.row .t{flex:1;min-width:0}
.row h3{font:400 var(--fs)/1.08 var(--serif);letter-spacing:-.01em}
.row p{font:12.5px/1.25 var(--sans);color:var(--ink2);margin-top:2px}
.grip{width:30px;height:44px;flex:none;background-image:radial-gradient(var(--ink) 1.2px,transparent 1.4px);background-size:7px 7px;background-position:center;background-repeat:repeat;opacity:.5;clip-path:inset(10px 8px)}
.cut{position:absolute;left:0;right:0;height:30px;display:flex;align-items:center;gap:8px;padding:0 20px;font:600 10.5px var(--mono);color:var(--red);transition:top .2s;text-transform:uppercase;white-space:nowrap}
.cut:before,.cut:after{content:"";flex:1;border-top:1.5px dashed var(--red)}
.below{opacity:.62}
</style></head><body class=""><div class="phone" id="phone"><div class="sb"><span>9:41</span><i></i></div><header class="where"><b>Rank</b><span>Wrenhollow site · 2027 plan</span></header><main>
  <div class="ask"><h1>What should we build first?</h1><p>Drag to reorder. We can build three this year.</p></div>
  <div class="list" id="l"><div class="cut" id="c">Above this line, we build</div></div>
</main><footer class="dock"><div class="rec" id="rec"><b>Record</b><span>I ordered these by likely sales. You decide.</span></div><form class="other" id="other"><input aria-label="Answer another way" placeholder="Add something to this list"><button type="button" class="mic" aria-label="Speak your answer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2" width="6" height="10.5" rx="3"/><path d="M3.8 9.5a6.2 6.2 0 0 0 12.4 0M10 15.8V18"/></svg></button></form></footer><div class="home"></div></div><script>const DOCK_SAY="Add a page for school gardens.";const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function rec(t){const b=$('#rec'),e=$('#rec span');if(!e)return;e.textContent=t;b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
function onDrag(el,h){el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);h.start&&h.start(ev);const m=e=>h.move&&h.move(e),u=e=>{el.removeEventListener('pointermove',m);el.removeEventListener('pointerup',u);el.removeEventListener('pointercancel',u);h.end&&h.end(e)};el.addEventListener('pointermove',m);el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)})}
(function(){const p=$('#phone');const fit=()=>{p.style.zoom=innerWidth<390?innerWidth/390:''};fit();addEventListener('resize',fit);const f=$('#other');if(!f)return;const i=$('input',f),m=$('.mic',f);f.addEventListener('submit',e=>{e.preventDefault();if(i.value.trim()){rec('Your own words: '+i.value.trim());i.value=''}});m.addEventListener('click',()=>{m.classList.add('on');const ph=i.placeholder;i.placeholder='Listening';setTimeout(()=>{m.classList.remove('on');i.placeholder=ph;i.value=DOCK_SAY},1200)})})();

const H=[124,106,94,78,74,72],F=[31,26,22,18,17,17];
let items=[['Reorder in one tap','Repeat buyers ask for this most.'],['Planting calendar','It brings people back each week.'],['Gift boxes','Strong in December only.'],['Wholesale page','Three shops asked for it.'],['Seed swap forum','It needs a person to run it.'],['Rewards card','It costs money. The gain is unclear.']].map(([n,w],i)=>({n,w,id:i}));
const L=$('#l');items.forEach(it=>{it.el=document.createElement('div');it.el.className='row';it.el.innerHTML=`<div class="num"></div><div class="t"><h3>${it.n}</h3><p>${it.w}</p></div><div class="grip"></div>`;L.append(it.el);
 let oy,top0;onDrag(it.el,{start(e){oy=e.clientY;top0=it.el.offsetTop;it.el.classList.add('drag')},move(e){const y=top0+e.clientY-oy;it.el.style.top=y+'px';const mid=y+it.el.offsetHeight/2;const ys=pos();let t=ys.findIndex((v,i)=>mid<v+H[i]/2);if(t<0)t=items.length-1;const c=items.indexOf(it);if(t!==c){items.splice(c,1);items.splice(t,0,it);lay(it)}},end(){it.el.classList.remove('drag');lay();rec(`You moved ${it.n} to place ${items.indexOf(it)+1}.`)}})});
function pos(){let y=0;return H.map((h,i)=>{const v=y;y+=h+(i==2?30:0);return v})}
function lay(skip){const ys=pos();items.forEach((it,i)=>{const e=it.el;e.style.height=H[i]+'px';e.style.setProperty('--fs',F[i]+'px');e.style.setProperty('--fn',Math.max(F[i]+4,20)+'px');$('.num',e).textContent=i+1;e.classList.toggle('below',i>2);if(it!==skip)e.style.top=ys[i]+'px'});$('#c').style.top=ys[2]+H[2]+'px'}
lay();
</script></body></html>
