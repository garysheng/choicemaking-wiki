<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Hand off</title><style>:root{--paper:#f6f1e7;--paper2:#ece5d6;--page:#fbf8f1;--ink:#1a1a1a;--ink2:#555048;--ink3:#8a8377;--rule:rgba(26,26,26,.16);--red:#c13d1c;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#e4dccb;display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:auto}
.phone{width:390px;height:844px;flex:none;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sb{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font:600 13px var(--sans)}
.sb i{width:22px;height:11px;border:1px solid currentColor;border-radius:3px;position:relative;opacity:.8}
.sb i:before{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.where{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 20px 9px;font:500 11px/1.3 var(--mono);color:var(--ink2);border-bottom:1px solid var(--ink)}
.where b{font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.where span{text-align:right}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
h1{font:400 27px/1.14 var(--serif);letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.dock{flex:none;padding:0 16px;border-top:1px solid var(--rule);background:var(--paper)}
.rec{display:flex;gap:9px;align-items:baseline;padding:7px 4px 6px;font:12.5px/1.3 var(--sans);color:var(--ink2);min-height:32px}
.rec b{font:600 10.5px var(--mono);text-transform:uppercase;color:var(--ink);letter-spacing:.03em;flex:none}
.rec.flash span{animation:fl .9s ease-out}
@keyframes fl{0%{background:rgba(193,61,28,.22)}100%{background:transparent}}
.other{display:flex;align-items:center;height:46px;border:1px solid var(--ink);border-radius:22px;padding-left:16px;background:var(--page)}
.other input{flex:1;min-width:0;border:0;background:none;outline:0;font:15px var(--sans);color:var(--ink);height:44px}
.other input::placeholder{color:var(--ink2)}
.mic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.mic.on{color:var(--red)}
.home{flex:none;height:22px;position:relative}
.home:after{content:"";position:absolute;left:50%;bottom:7px;width:128px;height:4.5px;border-radius:3px;margin-left:-64px;background:var(--ink)}
.dark{--paper:#151412;--ink:#f3eee3;--ink2:#a79f91;--ink3:#7a7367;--rule:rgba(243,238,227,.2);--page:#201e1a}

.ask{padding:12px 20px 10px}
.ask p{font:14px/1.3 var(--sans);color:var(--ink2);margin-top:3px}
.th{display:flex;gap:4px;padding:0 20px}
.th span{flex:1;height:82px;overflow:hidden;display:block}
.th svg{width:100%;height:100%;display:block}
.who{padding:10px 20px 0}
.w{display:flex;gap:12px;align-items:center;width:100%;min-height:68px;text-align:left;border-top:1px solid var(--rule);padding:7px 0}
.w:last-child{border-bottom:1px solid var(--rule)}
.w i{width:24px;height:24px;border:1.5px solid var(--ink);border-radius:50%;flex:none;position:relative}
.w.on i:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--red)}
.w h3{font:400 20px/1.1 var(--serif)}
.w p{font:13px/1.3 var(--sans);color:var(--ink2);margin-top:2px}
.tick{flex:1;min-height:0;margin:12px 12px 8px;background:var(--ink);color:var(--paper);position:relative;padding:12px 18px;display:flex;flex-direction:column}
.tick:before,.tick:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--paper);bottom:60px}
.tick:before{left:-10px}.tick:after{right:-10px}
.tick dl{display:grid;grid-template-columns:76px 1fr;gap:7px 8px;font:15px/1.3 var(--sans)}
.tick dt{font:500 11px/20px var(--mono);opacity:.72;text-transform:uppercase}
.tick .gv{margin:auto -18px -12px;height:60px;border-top:1.5px dashed rgba(246,241,231,.5);font:600 16px var(--sans);color:var(--paper);width:calc(100% + 36px)}
</style></head><body class=""><div class="phone" id="phone"><div class="sb"><span>9:41</span><i></i></div><header class="where"><b>Hand off</b><span>Coast trip album · Cover</span></header><main>
  <div class="ask"><h1>Who picks the cover?</h1><p>You can give this choice away. It stays on your record.</p></div>
  <div class="th" id="th"></div>
  <div class="who" id="who"></div>
  <div class="tick">
    <dl>
      <dt>To</dt><dd id="to"></dd>
      <dt>Knows</dt><dd id="kn"></dd>
      <dt>By</dt><dd id="by"></dd>
      <dt>Your note</dt><dd>Use a photo with all of us in it.</dd>
      <dt>You keep</dt><dd>The right to undo this for 7 days.</dd>
    </dl>
    <button class="gv" id="go">Hand it off</button>
  </div>
</main><footer class="dock"><div class="rec" id="rec"><b>Record</b><span>You have not given this choice to anyone.</span></div><form class="other" id="other"><input aria-label="Answer another way" placeholder="Name someone else"><button type="button" class="mic" aria-label="Speak your answer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2" width="6" height="10.5" rx="3"/><path d="M3.8 9.5a6.2 6.2 0 0 0 12.4 0M10 15.8V18"/></svg></button></form></footer><div class="home"></div></div><script>const DOCK_SAY="Give it to Grandma. She can pick by phone.";const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function rec(t){const b=$('#rec'),e=$('#rec span');if(!e)return;e.textContent=t;b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
function onDrag(el,h){el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);h.start&&h.start(ev);const m=e=>h.move&&h.move(e),u=e=>{el.removeEventListener('pointermove',m);el.removeEventListener('pointerup',u);el.removeEventListener('pointercancel',u);h.end&&h.end(e)};el.addEventListener('pointermove',m);el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)})}
(function(){const p=$('#phone');const fit=()=>{p.style.zoom=innerWidth<390?innerWidth/390:''};fit();addEventListener('resize',fit);const f=$('#other');if(!f)return;const i=$('input',f),m=$('.mic',f);f.addEventListener('submit',e=>{e.preventDefault();if(i.value.trim()){rec('Your own words: '+i.value.trim());i.value=''}});m.addEventListener('click',()=>{m.classList.add('on');const ph=i.placeholder;i.placeholder='Listening';setTimeout(()=>{m.classList.remove('on');i.placeholder=ph;i.value=DOCK_SAY},1200)})})();
function rng(s){let x=s*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}
const SKY=[['#f2d9a8','#ee9f6a'],['#cfe0dc','#9fc2c4'],['#f3e2c6','#d9b98c'],['#e9c6a8','#c9796a'],['#d7dfd2','#b3c4a8'],['#36404f','#8a6a70']];
const SEA=['#3f7480','#2f5d6b','#6b9a98','#4d6f62'],SAND=['#e3c99a','#d6b47c','#cfa86f'],HILL=['#5e7a56','#7d8f5c','#4a6152','#a08a55'],CLOTH=['#c13d1c','#e8b23a','#2f5d6b','#f6f1e7','#7a3f5a'];
function scene(seed,w=120,h=120){const r=rng(seed),R=a=>a[Math.floor(r()*a.length)],kind=seed%6,sky=R(SKY),id='g'+seed;let s=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#${id})"/>`;
const sx=w*(.2+r()*.6),sy=h*(.15+r()*.25),sr=7+r()*9;s+=`<circle cx="${sx}" cy="${sy}" r="${sr}" fill="#fff4d6" opacity=".9"/>`;
const hz=h*(.45+r()*.15);
const person=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><circle cy="-13" r="3" fill="#3a2a22"/><path d="M-3.4-9h6.8l1.2 10h-9.2z" fill="${R(CLOTH)}"/><path d="M-2 1v6M2 1v6" stroke="#3a2a22" stroke-width="1.6"/></g>`;
if(kind==0||kind==3){s+=`<rect y="${hz}" width="${w}" height="${h-hz}" fill="${R(SEA)}"/><path d="M0 ${hz+h*.2}Q${w*.5} ${hz+h*.12} ${w} ${hz+h*.24}V${h}H0z" fill="${R(SAND)}"/>`;const n=1+Math.floor(r()*3);for(let i=0;i<n;i++)s+=person(w*(.2+r()*.6),h*(.82+r()*.08),.9+r()*.3);if(kind==3)s+=`<path d="M${w*.25} ${hz-1}l${w*.12} 0l-${w*.02} 5h-${w*.08}zM${w*.3} ${hz-1}v-14l${w*.08} 12z" fill="#f6f1e7" stroke="#3a2a22" stroke-width=".6"/>`}
else if(kind==1){s+=`<path d="M0 ${hz+6}Q${w*.3} ${hz-22} ${w*.6} ${hz}T${w} ${hz-8}V${h}H0z" fill="${R(HILL)}"/><path d="M0 ${hz+26}Q${w*.5} ${hz+2} ${w} ${hz+24}V${h}H0z" fill="${R(HILL)}" opacity=".85"/>`;s+=person(w*(.3+r()*.4),h*.84,1)}
else if(kind==2){s+=`<rect y="${hz+10}" width="${w}" height="${h}" fill="${R(SEA)}"/><rect x="${w*.1}" y="${hz+4}" width="${w*.7}" height="4" fill="#5b4332"/>`;for(let i=0;i<4;i++)s+=`<rect x="${w*(.14+i*.2)}" y="${hz+8}" width="3" height="${h*.3}" fill="#5b4332"/>`;s+=person(w*.5,hz+3,.8)}
else if(kind==4){s+=`<rect y="${hz+8}" width="${w}" height="${h}" fill="${R(SAND)}"/><rect x="${w*.18}" y="${hz+14}" width="${w*.64}" height="${h*.26}" fill="${R(CLOTH)}" transform="skewX(-12)"/><circle cx="${w*.42}" cy="${hz+26}" r="6" fill="#f6f1e7"/><circle cx="${w*.6}" cy="${hz+30}" r="5" fill="#e8b23a"/>`;s+=person(w*.2,h*.84,1)+person(w*.82,h*.86,1.1)}
else{s+=`<rect y="${hz+12}" width="${w}" height="${h}" fill="${R(SAND)}"/><path d="M${w*.6} ${h*.2}l14 12l-12 14l-14-12z" fill="${R(CLOTH)}"/><path d="M${w*.58} ${h*.42}Q${w*.5} ${h*.6} ${w*.44} ${h*.72}" fill="none" stroke="#3a2a22" stroke-width=".8"/>`;s+=person(w*.42,h*.86,1.1)}
return s+'</svg>'}

[28,12,76,44].forEach(s=>{const e=document.createElement('span');e.innerHTML=scene(s,100,100);$('#th').append(e)});
const W=[['The agent','It knows your last 40 picks. It decides now.','The agent','Your 40 picks and this album','Today, in one minute'],['Mara, your sister','She took most of these photos.','Mara','The 4 photos. Not your notes.','Friday at 6 pm'],['Keep it for later','I ask you again on Sunday.','You, on Sunday','Everything you know now','Sunday at 9 am']];
let c=0;$('#who').innerHTML=W.map(w=>`<button class="w"><i></i><div><h3>${w[0]}</h3><p>${w[1]}</p></div></button>`).join('');
function draw(){$$('.w').forEach((b,i)=>b.classList.toggle('on',i==c));$('#to').textContent=W[c][2];$('#kn').textContent=W[c][3];$('#by').textContent=W[c][4]}
$$('.w').forEach((b,i)=>b.onclick=()=>{c=i;draw()});$('#go').onclick=()=>{rec(`You gave the cover choice to ${W[c][2]}.`);$('#go').textContent='Handed off'};draw();
</script></body></html>
