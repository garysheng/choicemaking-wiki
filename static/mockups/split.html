<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Split</title><style>:root{--paper:#f6f1e7;--paper2:#ece5d6;--page:#fbf8f1;--ink:#1a1a1a;--ink2:#555048;--ink3:#8a8377;--rule:rgba(26,26,26,.16);--red:#c13d1c;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#e4dccb;display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:auto}
.phone{width:390px;height:844px;flex:none;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sb{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font:600 13px var(--sans)}
.sb i{width:22px;height:11px;border:1px solid currentColor;border-radius:3px;position:relative;opacity:.8}
.sb i:before{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.where{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 20px 9px;font:500 11px/1.3 var(--mono);color:var(--ink2);border-bottom:1px solid var(--ink)}
.where b{font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.where span{text-align:right}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
h1{font:400 27px/1.14 var(--serif);letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.dock{flex:none;padding:0 16px;border-top:1px solid var(--rule);background:var(--paper)}
.rec{display:flex;gap:9px;align-items:baseline;padding:7px 4px 6px;font:12.5px/1.3 var(--sans);color:var(--ink2);min-height:32px}
.rec b{font:600 10.5px var(--mono);text-transform:uppercase;color:var(--ink);letter-spacing:.03em;flex:none}
.rec.flash span{animation:fl .9s ease-out}
@keyframes fl{0%{background:rgba(193,61,28,.22)}100%{background:transparent}}
.other{display:flex;align-items:center;height:46px;border:1px solid var(--ink);border-radius:22px;padding-left:16px;background:var(--page)}
.other input{flex:1;min-width:0;border:0;background:none;outline:0;font:15px var(--sans);color:var(--ink);height:44px}
.other input::placeholder{color:var(--ink2)}
.mic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.mic.on{color:var(--red)}
.home{flex:none;height:22px;position:relative}
.home:after{content:"";position:absolute;left:50%;bottom:7px;width:128px;height:4.5px;border-radius:3px;margin-left:-64px;background:var(--ink)}
.dark{--paper:#151412;--ink:#f3eee3;--ink2:#a79f91;--ink3:#7a7367;--rule:rgba(243,238,227,.2);--page:#201e1a}

.ask{padding:12px 20px 11px;display:flex;justify-content:space-between;align-items:baseline}
.ask span{font:500 11.5px var(--mono);color:var(--ink2)}
.stack{flex:1;min-height:0;position:relative;touch-action:none;border-top:1px solid var(--ink)}
.band{position:absolute;left:0;right:0;padding:9px 20px 0;overflow:hidden;color:var(--c);display:flex;justify-content:space-between;gap:12px}
.band h3{font:400 23px/1.1 var(--serif);letter-spacing:-.01em;white-space:nowrap}
.band p{font:12.5px/1.3 var(--sans);opacity:.86;margin-top:3px;max-width:240px}
.band .amt{font:500 16px/1.5 var(--mono);text-align:right;white-space:nowrap}
.band .amt small{display:block;font:11px var(--mono);opacity:.75}
.hd{position:absolute;left:0;right:0;height:44px;margin-top:-22px;touch-action:none;cursor:ns-resize;z-index:3}
.hd:before{content:"";position:absolute;left:0;right:0;top:21.5px;height:1px;background:#1a1a1a}
.hd:after{content:"";position:absolute;left:50%;top:15px;width:54px;height:14px;margin-left:-27px;border-radius:7px;background:var(--paper);border:1px solid #1a1a1a;background-image:linear-gradient(#1a1a1a,#1a1a1a),linear-gradient(#1a1a1a,#1a1a1a);background-size:22px 1px;background-repeat:no-repeat;background-position:center 4px,center 7px}
</style></head><body class=""><div class="phone" id="phone"><div class="sb"><span>9:41</span><i></i></div><header class="where"><b>Split</b><span>Wrenhollow 2027 budget · Step 1 of 3</span></header><main>
  <div class="ask"><h1>Split $120,000</h1><span>$0 LEFT</span></div>
  <div class="stack" id="s"></div>
</main><footer class="dock"><div class="rec" id="rec"><b>Record</b><span>Start from last year. All money is placed.</span></div><form class="other" id="other"><input aria-label="Answer another way" placeholder="Tell me how to split it"><button type="button" class="mic" aria-label="Speak your answer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2" width="6" height="10.5" rx="3"/><path d="M3.8 9.5a6.2 6.2 0 0 0 12.4 0M10 15.8V18"/></svg></button></form></footer><div class="home"></div></div><script>const DOCK_SAY="Move more to seed stock. Take it from ads.";const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function rec(t){const b=$('#rec'),e=$('#rec span');if(!e)return;e.textContent=t;b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
function onDrag(el,h){el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);h.start&&h.start(ev);const m=e=>h.move&&h.move(e),u=e=>{el.removeEventListener('pointermove',m);el.removeEventListener('pointerup',u);el.removeEventListener('pointercancel',u);h.end&&h.end(e)};el.addEventListener('pointermove',m);el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)})}
(function(){const p=$('#phone');const fit=()=>{p.style.zoom=innerWidth<390?innerWidth/390:''};fit();addEventListener('resize',fit);const f=$('#other');if(!f)return;const i=$('input',f),m=$('.mic',f);f.addEventListener('submit',e=>{e.preventDefault();if(i.value.trim()){rec('Your own words: '+i.value.trim());i.value=''}});m.addEventListener('click',()=>{m.classList.add('on');const ph=i.placeholder;i.placeholder='Listening';setTimeout(()=>{m.classList.remove('on');i.placeholder=ph;i.value=DOCK_SAY},1200)})})();

const items=[
 {n:'Seed stock',v:44,last:40,why:'Sales grew. You ran out of two seeds in May.',b:'#d9a441',c:'#1a1a1a'},
 {n:'Packaging',v:26,last:18,why:'The new boxes cost more. They cut returns.',b:'#2f4a38',c:'#f1e9d6'},
 {n:'Website',v:18,last:22,why:'The big rebuild is done.',b:'#bd4f28',c:'#fff3e2'},
 {n:'Part-time help',v:20,last:26,why:'One person can pack in spring.',b:'#e8dcc3',c:'#1a1a1a'},
 {n:'Ads',v:12,last:14,why:'Ads bring few repeat buyers.',b:'#2b2a27',c:'#f1e9d6'}];
const S=$('#s'),H=()=>S.clientHeight,MIN=8,fmt=k=>'$'+k+',000';
items.forEach(i=>{i.el=document.createElement('div');i.el.className='band';i.el.style.cssText+=`background:${i.b};--c:${i.c}`;i.el.innerHTML=`<div><h3>${i.n}</h3><p>${i.why}</p></div><div class="amt"><span></span><small></small></div>`;S.append(i.el)});
const hs=items.slice(1).map((_,k)=>{const h=document.createElement('div');h.className='hd';h.setAttribute('aria-label','Drag to move money');S.append(h);
 let y0,a,b;onDrag(h,{start(e){y0=e.clientY;a=items[k].v;b=items[k+1].v},move(e){const d=Math.round((e.clientY-y0)/(H()/120)),na=Math.max(MIN,Math.min(a+b-MIN,a+d));items[k].v=na;items[k+1].v=a+b-na;draw()},end(){const x=items[k];rec(`${x.n} now gets ${fmt(x.v)}. Last year: ${fmt(x.last)}.`)}});return h});
function draw(){const u=H()/120;let y=0;items.forEach((i,k)=>{const h=i.v*u;i.el.style.top=y+'px';i.el.style.height=h+'px';$('.amt span',i.el).textContent=fmt(i.v);$('.amt small',i.el).textContent='LAST '+i.last+'K';$('p',i.el).style.display=h<72?'none':'';y+=h;if(hs[k])hs[k].style.top=y+'px'})}
draw();
</script></body></html>
