<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Rate</title><style>:root{--paper:#f6f1e7;--paper2:#ece5d6;--page:#fbf8f1;--ink:#1a1a1a;--ink2:#555048;--ink3:#8a8377;--rule:rgba(26,26,26,.16);--red:#c13d1c;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#e4dccb;display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:auto}
.phone{width:390px;height:844px;flex:none;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sb{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font:600 13px var(--sans)}
.sb i{width:22px;height:11px;border:1px solid currentColor;border-radius:3px;position:relative;opacity:.8}
.sb i:before{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.where{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 20px 9px;font:500 11px/1.3 var(--mono);color:var(--ink2);border-bottom:1px solid var(--ink)}
.where b{font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.where span{text-align:right}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
h1{font:400 27px/1.14 var(--serif);letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.dock{flex:none;padding:0 16px;border-top:1px solid var(--rule);background:var(--paper)}
.rec{display:flex;gap:9px;align-items:baseline;padding:7px 4px 6px;font:12.5px/1.3 var(--sans);color:var(--ink2);min-height:32px}
.rec b{font:600 10.5px var(--mono);text-transform:uppercase;color:var(--ink);letter-spacing:.03em;flex:none}
.rec.flash span{animation:fl .9s ease-out}
@keyframes fl{0%{background:rgba(193,61,28,.22)}100%{background:transparent}}
.other{display:flex;align-items:center;height:46px;border:1px solid var(--ink);border-radius:22px;padding-left:16px;background:var(--page)}
.other input{flex:1;min-width:0;border:0;background:none;outline:0;font:15px var(--sans);color:var(--ink);height:44px}
.other input::placeholder{color:var(--ink2)}
.mic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.mic.on{color:var(--red)}
.home{flex:none;height:22px;position:relative}
.home:after{content:"";position:absolute;left:50%;bottom:7px;width:128px;height:4.5px;border-radius:3px;margin-left:-64px;background:var(--ink)}
.dark{--paper:#151412;--ink:#f3eee3;--ink2:#a79f91;--ink3:#7a7367;--rule:rgba(243,238,227,.2);--page:#201e1a}

.ask{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.prog{display:flex;gap:4px;margin-bottom:9px}
.prog i{height:4px;flex:1;background:var(--paper2)}
.prog i.d{background:var(--ink)}
.prog i.n{background:var(--red)}
.q{font:italic 400 18px/1.34 var(--serif);color:var(--ink);margin-top:8px}
.q cite{display:block;font:500 11px var(--mono);font-style:normal;color:var(--ink2);margin-top:4px}
.lad{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px;position:relative}
.lad:before{content:"";position:absolute;left:41px;top:10px;bottom:10px;width:1px;background:var(--ink)}
.r{flex:1;display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:50px;position:relative}
.r b{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;font:400 21px var(--serif);transition:all .15s}
.r span{font:14.5px/1.3 var(--sans);color:var(--ink2);transition:color .15s}
.r.on b{background:var(--ink);color:var(--paper);transform:scale(1.14)}
.r.on span{color:var(--ink);font-weight:500}
.r .g{position:absolute;right:0;top:5px;font:600 10px var(--mono);color:var(--red);display:none}
.done .r.guess .g{display:block}
.ct{flex:none;padding:4px 20px 8px;display:flex;justify-content:space-between;gap:10px}
.ct button{height:44px;font:500 14px var(--sans)}
.ct .nx{flex:none;width:110px;background:var(--ink);color:var(--paper);border-radius:22px;font-weight:600}
.ct .nx:disabled{opacity:.3}
</style></head><body class=""><div class="phone" id="phone"><div class="sb"><span>9:41</span><i></i></div><header class="where"><b>Rate</b><span>Ana Moreau · Score sheet, part 2 of 5</span></header><main id="m">
  <div class="ask"><div class="prog"><i class="d"></i><i class="n"></i><i></i><i></i><i></i></div>
    <h1>Calm in a crisis</h1>
    <p class="q">"The power failed at 2 am. I moved the two worst patients first. Then I called the doctor."<cite>INTERVIEW, MINUTE 14</cite></p></div>
  <div class="lad" id="l"></div>
  <div class="ct"><button id="na">I cannot tell from this</button><button class="nx" id="nx" disabled>Next</button></div>
</main><footer class="dock"><div class="rec" id="rec"><b>Record</b><span>You see my guess after you score.</span></div><form class="other" id="other"><input aria-label="Answer another way" placeholder="Tell me why you gave this score"><button type="button" class="mic" aria-label="Speak your answer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2" width="6" height="10.5" rx="3"/><path d="M3.8 9.5a6.2 6.2 0 0 0 12.4 0M10 15.8V18"/></svg></button></form></footer><div class="home"></div></div><script>const DOCK_SAY="She stayed calm. But she did not ask for help soon.";const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function rec(t){const b=$('#rec'),e=$('#rec span');if(!e)return;e.textContent=t;b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
function onDrag(el,h){el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);h.start&&h.start(ev);const m=e=>h.move&&h.move(e),u=e=>{el.removeEventListener('pointermove',m);el.removeEventListener('pointerup',u);el.removeEventListener('pointercancel',u);h.end&&h.end(e)};el.addEventListener('pointermove',m);el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)})}
(function(){const p=$('#phone');const fit=()=>{p.style.zoom=innerWidth<390?innerWidth/390:''};fit();addEventListener('resize',fit);const f=$('#other');if(!f)return;const i=$('input',f),m=$('.mic',f);f.addEventListener('submit',e=>{e.preventDefault();if(i.value.trim()){rec('Your own words: '+i.value.trim());i.value=''}});m.addEventListener('click',()=>{m.classList.add('on');const ph=i.placeholder;i.placeholder='Listening';setTimeout(()=>{m.classList.remove('on');i.placeholder=ph;i.value=DOCK_SAY},1200)})})();

const a=[[5,'Leads others through the crisis. Others stay calm because of her.'],[4,'Acts in the right order. Calls for help in time.'],[3,'Stays calm. Needs someone to tell her the order.'],[2,'Acts, but in the wrong order under stress.'],[1,'Stops, or makes the crisis worse.']];
$('#l').innerHTML=a.map(([n,t])=>`<button class="r${n==4?' guess':''}" data-n="${n}"><b>${n}</b><span>${t}</span><em class="g mono" style="font-style:normal">MY GUESS: SHE NAMED HER STEPS</em></button>`).join('');
$$('.r').forEach(b=>b.onclick=()=>{$$('.r').forEach(x=>x.classList.toggle('on',x===b));$('#m').classList.add('done');$('#nx').disabled=false;rec(`You gave Ana ${b.dataset.n}. My guess was 4.`)});
$('#na').onclick=()=>{$$('.r').forEach(x=>x.classList.remove('on'));$('#nx').disabled=false;rec('You said this interview does not show it.')};
</script></body></html>
