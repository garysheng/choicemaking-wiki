<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Arrange</title><style>:root{--paper:#f6f1e7;--paper2:#ece5d6;--page:#fbf8f1;--ink:#1a1a1a;--ink2:#555048;--ink3:#8a8377;--rule:rgba(26,26,26,.16);--red:#c13d1c;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#e4dccb;display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:auto}
.phone{width:390px;height:844px;flex:none;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sb{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font:600 13px var(--sans)}
.sb i{width:22px;height:11px;border:1px solid currentColor;border-radius:3px;position:relative;opacity:.8}
.sb i:before{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.where{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 20px 9px;font:500 11px/1.3 var(--mono);color:var(--ink2);border-bottom:1px solid var(--ink)}
.where b{font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.where span{text-align:right}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
h1{font:400 27px/1.14 var(--serif);letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.dock{flex:none;padding:0 16px;border-top:1px solid var(--rule);background:var(--paper)}
.rec{display:flex;gap:9px;align-items:baseline;padding:7px 4px 6px;font:12.5px/1.3 var(--sans);color:var(--ink2);min-height:32px}
.rec b{font:600 10.5px var(--mono);text-transform:uppercase;color:var(--ink);letter-spacing:.03em;flex:none}
.rec.flash span{animation:fl .9s ease-out}
@keyframes fl{0%{background:rgba(193,61,28,.22)}100%{background:transparent}}
.other{display:flex;align-items:center;height:46px;border:1px solid var(--ink);border-radius:22px;padding-left:16px;background:var(--page)}
.other input{flex:1;min-width:0;border:0;background:none;outline:0;font:15px var(--sans);color:var(--ink);height:44px}
.other input::placeholder{color:var(--ink2)}
.mic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.mic.on{color:var(--red)}
.home{flex:none;height:22px;position:relative}
.home:after{content:"";position:absolute;left:50%;bottom:7px;width:128px;height:4.5px;border-radius:3px;margin-left:-64px;background:var(--ink)}
.dark{--paper:#151412;--ink:#f3eee3;--ink2:#a79f91;--ink3:#7a7367;--rule:rgba(243,238,227,.2);--page:#201e1a}

.ask{padding:12px 20px 8px}
.ask p{font:14px/1.3 var(--sans);color:var(--ink2);margin-top:3px}
.b{flex:1;min-height:0;position:relative;border-top:1px solid var(--ink)}
.cv{position:absolute;left:0;top:0;width:84px;height:100%;z-index:1;pointer-events:none}
.tk{position:absolute;left:84px;right:0;display:flex;align-items:center;padding:0 12px 0 10px;border-top:1px solid var(--rule);background:var(--paper);transition:top .2s;touch-action:none;cursor:grab}
.tk:first-of-type{border-top:0}
.tk.drag{transition:none;z-index:5;background:var(--page);box-shadow:0 8px 20px rgba(40,30,10,.22)}
.tk .tt{flex:1;min-width:0}
.tk h3{font:400 20px/1.1 var(--serif)}
.tk p{font:500 11px var(--mono);color:var(--ink2);margin-top:2px}
.grip{width:30px;height:44px;flex:none;background-image:radial-gradient(var(--ink) 1.2px,transparent 1.4px);background-size:7px 7px;opacity:.5;clip-path:inset(10px 8px)}
.jmp{position:absolute;right:48px;z-index:4;margin-top:-10px;height:20px;background:var(--red);color:#fff;font:600 10.5px/20px var(--mono);padding:0 8px;pointer-events:none;transition:top .2s}
.foot{flex:none;padding:6px 20px;border-top:1px solid var(--ink);font:13.5px/1.3 var(--sans);background:var(--page);min-height:50px}
</style></head><body class=""><div class="phone" id="phone"><div class="sb"><span>9:41</span><i></i></div><header class="where"><b>Arrange</b><span>Album: Salt Road · 8 songs</span></header><main>
  <div class="ask"><h1>How should the album move?</h1><p>Drag a song. The line shows the energy.</p></div>
  <div class="b" id="b"><svg class="cv" id="c"></svg></div>
  <div class="foot" id="f"></div>
</main><footer class="dock"><div class="rec" id="rec"><b>Record</b><span>I set a first order. One hard jump is marked.</span></div><form class="other" id="other"><input aria-label="Answer another way" placeholder="Tell me how the album should move"><button type="button" class="mic" aria-label="Speak your answer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2" width="6" height="10.5" rx="3"/><path d="M3.8 9.5a6.2 6.2 0 0 0 12.4 0M10 15.8V18"/></svg></button></form></footer><div class="home"></div></div><script>const DOCK_SAY="Open quiet. End on the slowest song.";const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function rec(t){const b=$('#rec'),e=$('#rec span');if(!e)return;e.textContent=t;b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
function onDrag(el,h){el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);h.start&&h.start(ev);const m=e=>h.move&&h.move(e),u=e=>{el.removeEventListener('pointermove',m);el.removeEventListener('pointerup',u);el.removeEventListener('pointercancel',u);h.end&&h.end(e)};el.addEventListener('pointermove',m);el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)})}
(function(){const p=$('#phone');const fit=()=>{p.style.zoom=innerWidth<390?innerWidth/390:''};fit();addEventListener('resize',fit);const f=$('#other');if(!f)return;const i=$('input',f),m=$('.mic',f);f.addEventListener('submit',e=>{e.preventDefault();if(i.value.trim()){rec('Your own words: '+i.value.trim());i.value=''}});m.addEventListener('click',()=>{m.classList.add('on');const ph=i.placeholder;i.placeholder='Listening';setTimeout(()=>{m.classList.remove('on');i.placeholder=ph;i.value=DOCK_SAY},1200)})})();

const trk=[['Low Tide',2,'72 BPM · D'],['Porch Light',5,'96 BPM · G'],['Nine Miles',7,'118 BPM · G'],['Salt Road',8,'124 BPM · E'],['Bad Radio',9,'136 BPM · E'],['Second Wind',3,'80 BPM · A'],['Slow Train Home',4,'88 BPM · D'],['Last Light',1,'66 BPM · D']].map(([n,e,m],i)=>({n,e,m}));
const B=$('#b'),RH=()=>B.clientHeight/8;
trk.forEach(t=>{t.el=document.createElement('div');t.el.className='tk';t.el.innerHTML=`<div class="tt"><h3>${t.n}</h3><p>${t.m}</p></div><div class="grip"></div>`;B.append(t.el);let oy,y0;onDrag(t.el,{start(e){oy=e.clientY;y0=t.el.offsetTop;t.el.classList.add('drag')},move(e){const y=y0+e.clientY-oy;t.el.style.top=y+'px';let to=Math.max(0,Math.min(7,Math.round(y/RH())));const c=trk.indexOf(t);if(to!=c){trk.splice(c,1);trk.splice(to,0,t);lay(t)}},end(){t.el.classList.remove('drag');lay();rec(`You moved ${t.n} to place ${trk.indexOf(t)+1}.`)}})});
function lay(skip){const h=RH();trk.forEach((t,i)=>{t.el.style.height=h+'px';if(t!==skip)t.el.style.top=i*h+'px'});
 const X=e=>14+e*6.2,Y=i=>i*h+h/2,P=trk.map((t,i)=>[X(t.e),Y(i)]);let d=`M${P[0]}`;for(let i=1;i<P.length;i++){const m=(P[i-1][1]+P[i][1])/2;d+=`C${P[i-1][0]} ${m} ${P[i][0]} ${m} ${P[i][0]} ${P[i][1]}`}
 let s=`<rect width="84" height="100%" fill="#ece5d6"/><path d="${d}" fill="none" stroke="#1a1a1a" stroke-width="2"/>`;P.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#1a1a1a"/><text x="${5}" y="${p[1]+4}" font-family="Georgia,serif" font-size="12" fill="#555048">${i+1}</text>`);
 $$('.jmp',B).forEach(x=>x.remove());let n=0;for(let i=1;i<8;i++){const g=Math.abs(trk[i].e-trk[i-1].e);if(g>=5){n++;const m=document.createElement('div');m.className='jmp';m.style.top=i*h+'px';m.textContent='HARD JUMP';B.append(m);s+=`<path d="M0 ${i*h}H84" stroke="#c13d1c" stroke-dasharray="3 3"/>`}}
 $('#c').innerHTML=s;$('#f').textContent=n?`${n==1?'One jump is':n+' jumps are'} hard. The change in energy may stop the listener.`:'No hard jumps. The album moves in one long shape.'}
lay();
</script></body></html>
